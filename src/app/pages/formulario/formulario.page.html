<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>formulario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">formulario</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-label position="stacked" name="nombre"> Nombre </ion-label>
    <ion-input [(ngModel)]="formulario.nombre"> </ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked"> Email </ion-label>
    <ion-input type="email" [(ngModel)]="formulario.email" name="email"> </ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked"> Edad </ion-label>
    <ion-input type="number" [(ngModel)]="formulario.edad" name="edad"> </ion-input>
  </ion-item>

  <ion-item>
    <ion-label> Fecha Nacimiento </ion-label>
  </ion-item>
  <ion-datetime presentation="date" [(ngModel)]="formulario.dob" name="dob"></ion-datetime>

  <ion-list>
    <ion-radio-group [(ngModel)]="formulario.genero" name="genero">
      <ion-item>
        <ion-label> Hombre </ion-label>
        <ion-radio value="Hombre"> </ion-radio>
      </ion-item>

      <ion-item>
        <ion-label> Mujer </ion-label>
        <ion-radio value="Mujer"> </ion-radio>
      </ion-item>
    </ion-radio-group>
  </ion-list>

  <ion-item>
    <ion-label> País </ion-label>
    <ion-select [(ngModel)]="formulario.pais">
      <ion-select-option value="España"> España </ion-select-option>
      <ion-select-option value="Francia"> Francia </ion-select-option>
      <ion-select-option value="Italia"> Italia </ion-select-option>
    </ion-select>
  </ion-item>

  <ion-item>
    <ion-checkbox [(ngModel)]="formulario.newsletter"> </ion-checkbox>
    <ion-label> Recibir newsletter </ion-label>
  </ion-item>

  <ion-item>
    <ion-toggle name="notificaciones"> </ion-toggle>
    <ion-label> Activar notificaciones </ion-label>
  </ion-item>

  <ion-item>
    <ion-label> Nivel Angular </ion-label>
  </ion-item>

  <ion-range min="0" max="10"> </ion-range>

  <ion-item>
    <ion-label position="stacked"> Observaciones </ion-label>
    <ion-textarea rows="5" [(ngModel)]="formulario.observaciones">
    </ion-textarea>
  </ion-item>


 <!--  <ion-item>
    <ion-label position="stacked"> Tecnologías </ion-label>
    <ion-input type="string" [(ngModel)]="formulario.tecnologias" name="tecnologias"> </ion-input>
  </ion-item> -->

    <ion-item>
    <ion-label> Tecnologías </ion-label>
    <ion-select multiple="true" [(ngModel)]="formulario.tecnologias">
      <ion-select-option value="IONIC"> IONIC </ion-select-option>
      <ion-select-option value="TypeScript"> TypeScript </ion-select-option>
      <ion-select-option value="Angular"> Angular </ion-select-option>
    </ion-select>
  </ion-item>

  
  <ion-button expand="block" (click)="guardar()"> Guardar Datos </ion-button>

</ion-content>
